<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Early Access Request</title>
</head>
<body style="margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background-color: #0A0A0A;">
    <table width="100%" cellpadding="0" cellspacing="0" style="background-color: #0A0A0A; padding: 40px 20px;">
        <tr>
            <td align="center">
                <table width="100%" cellpadding="0" cellspacing="0" style="max-width: 500px; background-color: #141414; border-radius: 16px; border: 1px solid #262626;">
                    <tr>
                        <td style="padding: 40px;">
                            <h1 style="margin: 0 0 24px 0; color: #E11D48; font-size: 24px; font-weight: 700;">
                                ❤️ New Early Access Request
                            </h1>
                            <p style="margin: 0 0 32px 0; color: #9CA3AF; font-size: 16px; line-height: 1.6;">
                                Someone wants early access to Hearted.
                            </p>
                            <table width="100%" cellpadding="0" cellspacing="0" style="background-color: #1E1E1E; border-radius: 12px; margin-bottom: 32px;">
                                <tr>
                                    <td style="padding: 20px;">
                                        <p style="margin: 0 0 8px 0; color: #6B7280; font-size: 12px; text-transform: uppercase; letter-spacing: 0.5px;">
                                            Email Address
                                        </p>
                                        <p style="margin: 0; color: #FFFFFF; font-size: 18px; font-weight: 500;">
                                            {{ email }}
                                        </p>
                                    </td>
                                </tr>
                            </table>
                            <p style="margin: 0; color: #6B7280; font-size: 14px;">
                                Reply to this email to reach them directly.
                            </p>
                        </td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>
</body>
</html>
